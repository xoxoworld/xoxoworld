  <rect x="1" y="1" width="838" height="230" rx="20" fill="url(#bg)" stroke="#2dd4bf" stroke-opacity="0.28" stroke-width="1.5"/>
  <rect x="1" y="1" width="838" height="4" rx="2" fill="url(#accent)" opacity="0.85"/>

