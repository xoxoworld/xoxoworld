<svg xmlns="http://www.w3.org/2000/svg" width="840" height="232" viewBox="0 0 840 232" role="img" aria-label="오늘의 날씨 서울: 대체로 맑음, 최고 14° 최저 4°">
  <title>오늘의 날씨 — 서울</title>
